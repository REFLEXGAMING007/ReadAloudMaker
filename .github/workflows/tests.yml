name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is pinned because actions/setup-python does not provide
        # Python 3.9 for ubuntu-latest (26.04); aeneas 1.7.3 needs 3.9.
        os: [ubuntu-22.04, windows-latest]
        python-version: ["3.9"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Install test dependencies
        run: python -m pip install lxml

      - name: Byte-compile
        run: python -m compileall -q make_readaloud.py qwen_pipeline readaloud_ui run.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v
